spring:
  application:
    name: tutornow-backend
  config:
    import: "optional:file:.env[.properties]"
  profiles:
    active: dev
  jpa:
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true
    diskspace:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:VGhpc0lzQURldmVsb3BtZW50U2VjcmV0S2V5Rm9yVHV0b3JOb3dBcHBsaWNhdGlvbjEyMzQ1Njc4OTA=}
    expiration-ms: 86400000
    verification-expiration-ms: 86400000
  verification:
    base-url: ${APP_VERIFICATION_BASE_URL:http://localhost:3000/verify-email}
  reset:
    base-url: ${APP_RESET_BASE_URL:http://localhost:3000/reset-password}
  change-confirm:
    base-url: ${APP_CHANGE_CONFIRM_BASE_URL:http://localhost:3000/confirm-password-change}
