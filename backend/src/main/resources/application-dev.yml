spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tutornow}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    co.edu.epi.tutornow: DEBUG
    org.springframework.security: DEBUG
