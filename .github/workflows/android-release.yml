name: Android Release (AAB)

# Builds a signed Android App Bundle (AAB) and optionally uploads it to Google Play.
#
# Required GitHub Secrets:
#   BACKEND_URL               - HTTPS API base URL (e.g. https://api.tutornow.com/api/v1)
#   ANDROID_KEYSTORE          - base64 of the release keystore (.keystore/.jks)
#   ANDROID_KEYSTORE_PASSWORD - keystore password
#   ANDROID_KEY_PASSWORD      - key (alias) password
#   ANDROID_KEY_ALIAS         - key alias (e.g. tutornow)
#   PLAY_SERVICE_ACCOUNT_JSON - Google Play service account JSON (only for upload)
#
# To publish automatically, set the repository variable UPLOAD_TO_PLAY=true and
# choose a track below. Without it, the workflow only produces the AAB artifact.
on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: "Android versionCode (integer, must increase every release)"
        required: true
        default: "1"
      versionName:
        description: "Android versionName (semver, e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      track:
        description: "Play track for automatic upload (only if UPLOAD_TO_PLAY=true)"
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  build-release:
    name: Build signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js static export
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.BACKEND_URL }}
        run: npm run build:web

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -sSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Restore release keystore
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          set -e
          mkdir -p app
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > app/release.keystore
          cat > keystore.properties <<'EOF'
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build signed AAB
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.11.1
          arguments: >-
            bundleRelease
            -PversionCode=${{ inputs.versionCode }}
            -PversionName=${{ inputs.versionName }}
            --no-daemon --stacktrace
          build-root-directory: frontend/android

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload to Google Play
        if: ${{ vars.UPLOAD_TO_PLAY == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.tutornow.app
          releaseFiles: frontend/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: completed
